services:
  - type: web
    name: project3monkeys
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn project3monkeys.wsgi
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: False
      - key: DATABASE_URL
        fromDatabase:
          name: database3monkeys
          property: connectionString

databases:
  - name: database3monkeys
    plan: free
