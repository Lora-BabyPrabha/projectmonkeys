services:
  - type: web
    name: 3monkeys-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn project3monkeys.wsgi:application
    envVars:
      - key: DEBUG
        value: False
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: 3monkeys-db
          property: connectionString
databases:
  - name: 3monkeys-db
    plan: free
